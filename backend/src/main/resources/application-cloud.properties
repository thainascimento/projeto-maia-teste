
# MAIA TESTE - Configuracao na nuvem

# Banco MySQL da Enzonic
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/main?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Porta do Render
server.port=${PORT:8080}

# Nao expor detalhes tecnicos em respostas HTTP
server.error.include-message=never
server.error.include-binding-errors=never

# API Unsplash - imagens do Explora
unsplash.access-key=${UNSPLASH_ACCESS_KEY:}
